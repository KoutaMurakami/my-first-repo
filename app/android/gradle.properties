org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# このPC(Windows)ではJDKのUnix Domain Socket経由のループバック接続確立が失敗する既知の不具合があり、
# Gradleデーモン(バックグラウンド常駐プロセス)の起動に失敗する。
# デーモンを使わない設定にすることでこの問題を回避する(ビルドはやや遅くなるが安定して動く)。
org.gradle.daemon=false
# Gradleデーモンだけでなく、Kotlinコンパイラも専用デーモン(別プロセス)を
# 起動しようとして同じloopback接続エラーで失敗することが分かったため、
# Kotlinコンパイルもそのプロセス内で完結させる設定にする。
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
